name: Main Security Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-gate:
    name: SAST + Dependency + Secret Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security gate
        env:
          CI_SECURITY_RUN_ID: ${{ github.run_id }}
        run: pnpm run security:gate

      - name: Upload security gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-security-gate-log
          path: logs/ci-security-gate-*.log
          if-no-files-found: warn
