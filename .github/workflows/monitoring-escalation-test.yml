name: Monitoring Alarm Escalation Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitoring-escalation-test:
    name: Monitoring Alarm and Escalation Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run monitoring/escalation test
        run: pnpm run ops:monitoring-escalation

      - name: Upload monitoring evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops-monitoring-escalation-evidence
          path: |
            logs/ops-monitoring-escalation-*.log
            logs/ops-monitoring-escalation-*.server.log
          if-no-files-found: warn
