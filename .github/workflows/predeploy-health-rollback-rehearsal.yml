name: Predeploy Healthcheck Rollback Rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  healthcheck-rollback-rehearsal:
    name: Healthcheck and Rollback Rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run healthcheck and rollback rehearsal
        run: pnpm run ops:health-rollback

      - name: Upload rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops-health-rollback-evidence
          path: |
            logs/ops-health-rollback-*.log
            logs/ops-health-rollback-*.server.log
          if-no-files-found: warn
