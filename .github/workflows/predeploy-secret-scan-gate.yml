name: Predeploy Secret Scan Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan-gate:
    name: Secret Leak Policy Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run secret scan gate
        env:
          SECRET_SCAN_CI_RUN_ID: ${{ github.run_id }}
        run: pnpm run security:secret:gate

      - name: Upload secret scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-gate-evidence
          path: logs/secret-scan-gate-*.log
          if-no-files-found: warn
