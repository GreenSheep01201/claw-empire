# Claw-Empire nginx リバースプロキシ設定
# 配置先: /etc/nginx/sites-available/claw-empire
# 有効化: sudo ln -s /etc/nginx/sites-available/claw-empire /etc/nginx/sites-enabled/
#
# HTTPS 化 (推奨): sudo certbot --nginx -d claw.example.com

upstream claw_empire {
    server 127.0.0.1:8790;
    keepalive 32;
}

# HTTP → HTTPS リダイレクト (HTTPS を使わない場合はこのブロックを削除)
server {
    listen 80;
    listen [::]:80;
    server_name claw.example.com;  # ← 実際のドメインに変更

    location / {
        return 301 https://$host$request_uri;
    }
}

# メインサーバーブロック
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name claw.example.com;  # ← 実際のドメインに変更

    # SSL 証明書 (certbot が自動設定 または手動設定)
    # ssl_certificate     /etc/letsencrypt/live/claw.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/claw.example.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;

    # セキュリティヘッダー
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # ログ
    access_log /var/log/nginx/claw-empire.access.log;
    error_log  /var/log/nginx/claw-empire.error.log;

    # アップロードサイズ上限 (スキル / ファイル送信向け)
    client_max_body_size 50M;

    # HTTP API + 静的ファイル
    location / {
        proxy_pass http://claw_empire;
        proxy_http_version 1.1;

        # 実 IP 転送
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # タイムアウト (長時間の AI 処理向け)
        proxy_connect_timeout  60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # WebSocket (リアルタイム更新)
    location /ws {
        proxy_pass http://claw_empire;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;

        # WebSocket セッション維持
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

